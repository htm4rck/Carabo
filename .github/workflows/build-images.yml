name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carabo
          POSTGRES_PASSWORD: carabo_test
          POSTGRES_DB: carabo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U carabo -d carabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: carabo
          RABBITMQ_DEFAULT_PASS: carabo_test
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests
        run: ./gradlew test --no-daemon
      - name: Build API for isolation smoke
        run: ./gradlew :carabo-starter-quarkus:quarkusBuild --no-daemon
      - name: Seed cross-tenant fixtures
        working-directory: .
        env:
          PGPASSWORD: carabo_test
        run: |
          for migration in migrations/001-document-schema.sql migrations/003-gre-and-apikey.sql migrations/004-correlatives-and-idempotency.sql migrations/005-api-key-hardening.sql migrations/006-signing-and-note-metadata.sql migrations/007-utc-timestamps.sql; do
            psql -h localhost -U carabo -d carabo_test -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -h localhost -U carabo -d carabo_test -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO carabo.tenant (id,business_code,business_name,issuer_ruc,issuer_name,send_mode,environment,api_key_hash,active)
          VALUES
            ('aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa','TENANT_A','Tenant A','20111111111','Tenant A SAC','SUNAT_DIRECT','BETA',encode(sha256(convert_to('tenant-a-integration-key','UTF8')),'hex'),true),
            ('bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb','TENANT_B','Tenant B','20222222222','Tenant B SAC','SUNAT_DIRECT','BETA',encode(sha256(convert_to('tenant-b-integration-key','UTF8')),'hex'),true);
          INSERT INTO carabo.document (id,business_code,doc_type,series,number,issue_date,issuer_ruc,issuer_name,receiver_doc_type,receiver_doc,receiver_name,tax_base,igv_amount,total,status,external_id)
          VALUES
            ('10000000-0000-0000-0000-000000000001','TENANT_A','INVOICE','F001',1,current_date,'20111111111','Tenant A SAC','6','20999999991','Cliente A',100,18,118,'ACCEPTED','external-a'),
            ('20000000-0000-0000-0000-000000000002','TENANT_B','INVOICE','F001',1,current_date,'20222222222','Tenant B SAC','6','20999999992','Cliente B',100,18,118,'ACCEPTED','external-b');
          SQL
          mkdir -p "$RUNNER_TEMP/carabo-artifacts/TENANT_A/F001/1" "$RUNNER_TEMP/carabo-artifacts/TENANT_B/F001/1"
          printf '<Invoice>A</Invoice>' > "$RUNNER_TEMP/carabo-artifacts/TENANT_A/F001/1/signed.xml"
          printf '<ApplicationResponse>A</ApplicationResponse>' > "$RUNNER_TEMP/carabo-artifacts/TENANT_A/F001/1/cdr.xml"
          printf '<Invoice>B</Invoice>' > "$RUNNER_TEMP/carabo-artifacts/TENANT_B/F001/1/signed.xml"
          printf '<ApplicationResponse>B</ApplicationResponse>' > "$RUNNER_TEMP/carabo-artifacts/TENANT_B/F001/1/cdr.xml"
      - name: Verify tenant isolation through HTTP
        working-directory: .
        env:
          DB_URL: jdbc:postgresql://localhost:5432/carabo_test?currentSchema=carabo
          DB_USERNAME: carabo
          DB_PASSWORD: carabo_test
          RABBITMQ_HOST: localhost
          RABBITMQ_USERNAME: carabo
          RABBITMQ_PASSWORD: carabo_test
          QUARKUS_FLYWAY_MIGRATE_AT_START: "false"
          STORAGE_PATH: ${{ runner.temp }}/carabo-artifacts
          CARABO_ADMIN_KEY: ci-admin-key
          CARABO_TENANT_A_KEY: tenant-a-integration-key
          CARABO_TENANT_B_KEY: tenant-b-integration-key
          CARABO_DOCUMENT_A_ID: 10000000-0000-0000-0000-000000000001
          CARABO_DOCUMENT_B_ID: 20000000-0000-0000-0000-000000000002
          CARABO_EXTERNAL_A_ID: external-a
          CARABO_EXTERNAL_B_ID: external-b
        run: |
          java -jar apps/api/carabo-starter-quarkus/build/quarkus-app/quarkus-run.jar > "$RUNNER_TEMP/carabo-api.log" 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8998/health >/dev/null; then break; fi
            if ! kill -0 "$api_pid" 2>/dev/null; then cat "$RUNNER_TEMP/carabo-api.log"; exit 1; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8998/health >/dev/null || { cat "$RUNNER_TEMP/carabo-api.log"; exit 1; }
          ./scripts/verify-tenant-isolation.sh

  verify-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Compile production UI
        run: npm run build:prod

  verify-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: carabo
          POSTGRES_PASSWORD: carabo_test
          POSTGRES_DB: carabo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U carabo -d carabo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: carabo
      PGPASSWORD: carabo_test
      PGDATABASE: carabo_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply database migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f migrations/001-document-schema.sql
          psql -v ON_ERROR_STOP=1 -f migrations/003-gre-and-apikey.sql
          psql -v ON_ERROR_STOP=1 -f migrations/004-correlatives-and-idempotency.sql
          psql -v ON_ERROR_STOP=1 -f migrations/005-api-key-hardening.sql
          psql -v ON_ERROR_STOP=1 -f migrations/006-signing-and-note-metadata.sql
          psql -v ON_ERROR_STOP=1 -f migrations/007-utc-timestamps.sql
      - name: Verify UTC timestamp contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE column_type text;
          BEGIN
            SELECT data_type INTO column_type
            FROM information_schema.columns
            WHERE table_schema = 'carabo' AND table_name = 'document' AND column_name = 'created_at';
            IF column_type <> 'timestamp with time zone' THEN
              RAISE EXCEPTION 'document.created_at must be TIMESTAMPTZ, got %', column_type;
            END IF;
          END $$;
          SQL
      - name: Verify concurrent allocation
        run: bash scripts/verify-correlative-concurrency.sh 40 12

  build:
    needs: [verify-api, verify-ui, verify-database]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: carabo
            context: source
            dockerfile: source/apps/api/Dockerfile
          - image: carabo-ui
            context: source/apps/ui
            dockerfile: source/apps/ui/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build secrets
        run: |
          mkdir -p .docker-secrets
          printf "%s" "${NPMRC:-}" > .docker-secrets/npmrc
        env:
          NPMRC: ${{ secrets.NPMRC }}

      - name: Resolve tags
        id: meta
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/${{ matrix.image }}"
          ref="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA:0:12}"
          build_date="$(date -u +%Y-%m-%d)"
          {
            echo "version=0.2.0-${ref}.${short_sha}"
            echo "build_date=$build_date"
            echo "tags<<EOF"
            echo "$image:$ref"
            echo "$image:${{ github.sha }}"
            if [[ "${{ github.ref_type }}" == "branch" && "$ref" == "main" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            CARABO_UI_VERSION=${{ steps.meta.outputs.version }}
            CARABO_API_VERSION=${{ steps.meta.outputs.version }}
            CARABO_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            CARABO_COMMIT=${{ github.sha }}
          secret-files: |
            npmrc=.docker-secrets/npmrc
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy-platform:
    needs: build
    if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger matching Tordo.Platform deploy
        env:
          PLATFORM_DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PLATFORM_DEPLOY_TOKEN" ]; then
            echo "Missing PLATFORM_DEPLOY_TOKEN secret. Create a token allowed to dispatch workflows in htm4rck/Tordo.Platform." >&2
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            deploy_event="deploy-dev"
          else
            deploy_event="deploy-lab"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $PLATFORM_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/htm4rck/Tordo.Platform/dispatches \
            -d "{\"event_type\":\"${deploy_event}\",\"client_payload\":{\"source_repo\":\"$GITHUB_REPOSITORY\",\"source_ref\":\"$GITHUB_REF_NAME\",\"source_sha\":\"$GITHUB_SHA\"}}"

