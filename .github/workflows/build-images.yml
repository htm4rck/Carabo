name: Build Images

on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Run backend tests
        run: ./gradlew test --no-daemon

  verify-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Compile production UI
        run: npm run build:prod

  build:
    needs: [verify-api, verify-ui]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: carabo
            context: source
            dockerfile: source/apps/api/Dockerfile
          - image: carabo-ui
            context: source/apps/ui
            dockerfile: source/apps/ui/Dockerfile

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build secrets
        run: |
          mkdir -p .docker-secrets
          printf "%s" "${NPMRC:-}" > .docker-secrets/npmrc
        env:
          NPMRC: ${{ secrets.NPMRC }}

      - name: Resolve tags
        id: meta
        shell: bash
        run: |
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/$owner/${{ matrix.image }}"
          ref="${GITHUB_REF_NAME//\//-}"
          short_sha="${GITHUB_SHA:0:12}"
          build_date="$(date -u +%Y-%m-%d)"
          {
            echo "version=0.2.0-${ref}.${short_sha}"
            echo "build_date=$build_date"
            echo "tags<<EOF"
            echo "$image:$ref"
            echo "$image:${{ github.sha }}"
            if [[ "${{ github.ref_type }}" == "branch" && "$ref" == "main" ]]; then
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
            CARABO_UI_VERSION=${{ steps.meta.outputs.version }}
            CARABO_API_VERSION=${{ steps.meta.outputs.version }}
            CARABO_BUILD_DATE=${{ steps.meta.outputs.build_date }}
            CARABO_COMMIT=${{ github.sha }}
          secret-files: |
            npmrc=.docker-secrets/npmrc
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  deploy-platform:
    needs: build
    if: github.ref_type == 'branch' && (github.ref_name == 'main' || github.ref_name == 'master' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger matching Tordo.Platform deploy
        env:
          PLATFORM_DEPLOY_TOKEN: ${{ secrets.PLATFORM_DEPLOY_TOKEN }}
        run: |
          if [ -z "$PLATFORM_DEPLOY_TOKEN" ]; then
            echo "Missing PLATFORM_DEPLOY_TOKEN secret. Create a token allowed to dispatch workflows in htm4rck/Tordo.Platform." >&2
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "develop" ]; then
            deploy_event="deploy-dev"
          else
            deploy_event="deploy-lab"
          fi

          curl -fsS -X POST \
            -H "Authorization: Bearer $PLATFORM_DEPLOY_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/htm4rck/Tordo.Platform/dispatches \
            -d "{\"event_type\":\"${deploy_event}\",\"client_payload\":{\"source_repo\":\"$GITHUB_REPOSITORY\",\"source_ref\":\"$GITHUB_REF_NAME\",\"source_sha\":\"$GITHUB_SHA\"}}"

