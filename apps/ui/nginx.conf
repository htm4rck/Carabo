map $sent_http_content_type $carabo_html_cache_control {
    default "";
    "~^text/html" "no-store";
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control $carabo_html_cache_control always;

    location /carabo/ui/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /carabo/ui/index.html;
    }

    location /carabo/api/ {
        proxy_pass http://kong:8000/carabo/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
