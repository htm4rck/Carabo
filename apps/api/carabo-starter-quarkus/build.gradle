plugins {
  id 'io.quarkus'
}

dependencies {
  implementation platform(project(':carabo-bom'))
  implementation project(':carabo-core')
  implementation project(':carabo-signer')
  implementation project(':carabo-sunat-client')
  implementation project(':carabo-ose-client')
  implementation project(':carabo-storage')

  implementation 'io.quarkus:quarkus-rest-jackson'
  implementation 'io.quarkus:quarkus-arc'
  implementation 'io.quarkus:quarkus-hibernate-orm'
  implementation 'io.quarkus:quarkus-jdbc-postgresql'
  implementation 'io.quarkus:quarkus-flyway'
  implementation 'io.quarkus:quarkus-messaging-rabbitmq'
  implementation 'io.quarkus:quarkus-scheduler'
  implementation 'io.quarkus:quarkus-smallrye-openapi'
  implementation 'org.apache.poi:poi-ooxml:5.2.5'

  testImplementation 'io.quarkus:quarkus-junit5'
  testImplementation 'io.rest-assured:rest-assured'
}

// Keep the repository-level SQL files as the single source of truth while
// packaging only migrations owned by the Carabo schema in the application.
tasks.named('processResources') {
  from(rootProject.file('../../migrations')) {
    include '001-document-schema.sql', '003-gre-and-apikey.sql'
    rename '001-document-schema.sql', 'V1__document_schema.sql'
    rename '003-gre-and-apikey.sql', 'V2__gre_and_api_key.sql'
    into 'db/migration'
  }
}
