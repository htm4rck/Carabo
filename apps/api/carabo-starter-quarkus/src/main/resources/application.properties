quarkus.http.port=8998

# Database
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/tordo?currentSchema=carabo}
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:yourpassword}
quarkus.hibernate-orm.database.default-schema=carabo
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.packages=io.carabo.core.entity,io.carabo.core.entity.gre

# Database migrations. Existing DEV installations are baselined at V2;
# empty databases apply V1 and V2 automatically.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=carabo
quarkus.flyway.create-schemas=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=2
quarkus.flyway.locations=filesystem:/app/migrations

# RabbitMQ
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:tordo}
rabbitmq-password=${RABBITMQ_PASSWORD:tordo123}

# Incoming channel: document-emit
mp.messaging.incoming.document-emit.connector=smallrye-rabbitmq
mp.messaging.incoming.document-emit.exchange.name=carabo.exchange
mp.messaging.incoming.document-emit.exchange.type=direct
mp.messaging.incoming.document-emit.queue.name=carabo.document.emit
mp.messaging.incoming.document-emit.routing-keys=document.emit
mp.messaging.incoming.document-emit.exchange.declare=true
mp.messaging.incoming.document-emit.queue.declare=true
mp.messaging.incoming.document-emit.failure-strategy=reject
mp.messaging.incoming.document-emit.auto-bind-dlq=true
mp.messaging.incoming.document-emit.dead-letter-exchange=carabo.dlx
mp.messaging.incoming.document-emit.dead-letter-queue-name=carabo.document.emit.dlq
mp.messaging.incoming.document-emit.dead-letter-routing-key=document.emit.failed
mp.messaging.incoming.document-emit.dlx.declare=true
mp.messaging.incoming.document-emit.max-outstanding-messages=${CARABO_CONSUMER_CONCURRENCY:16}

# Outgoing channel used by the external asynchronous ingestion API. Broker
# acknowledgement is completed before the HTTP endpoint returns 202.
mp.messaging.outgoing.document-emit-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.document-emit-out.exchange.name=carabo.exchange
mp.messaging.outgoing.document-emit-out.exchange.type=direct
mp.messaging.outgoing.document-emit-out.exchange.declare=true
mp.messaging.outgoing.document-emit-out.default-routing-key=document.emit

# Certificates base path (each tenant has its own .pfx file inside)
carabo.certs.base-path=${CERTS_BASE_PATH:/app/certs}

# Storage base path (segmented by businessCode/series/number/)
carabo.storage.base-path=${STORAGE_PATH:/app/storage/documents}
carabo.storage.encryption-key=${CARABO_STORAGE_ENCRYPTION_KEY:}

# Technical timestamps are persisted as UTC instants. Fiscal calendar dates
# (issue dates, RC/RA dates) are resolved explicitly in Peru business time.
carabo.time.fiscal-zone=${CARABO_FISCAL_TIME_ZONE:America/Lima}

# Certificate uploads are capped again in CertificateService after multipart parsing.
quarkus.http.limits.max-body-size=6M

# Required to access /tenants. It defaults to the mounted secret store; a
# plaintext environment value remains available only for legacy deployments.
carabo.security.admin-key=${CARABO_ADMIN_KEY:secret://admin-key}

# Tenant credentials may use secret://name references resolved from a mounted store.
carabo.secrets.base-path=${CARABO_SECRETS_PATH:/run/secrets/carabo}

# Human sessions are issued by Tordo Auth. Memberships and Carabo roles are
# resolved server-side from the central auth schema for the active business.
mp.jwt.verify.publickey.location=${JWKS_URI:http://localhost:47613/auth/.well-known/jwks.json}
mp.jwt.verify.issuer=${JWT_ISSUER:https://auth.tordo.local}
mp.jwt.verify.audiences=${JWT_AUDIENCE:tordo-api}

# Layout service (tordo.layout) for PDF generation
carabo.layout.base-url=${LAYOUT_BASE_URL:http://localhost:47617/layout}

# OpenAPI
quarkus.smallrye-openapi.info-title=Carabo API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API de Facturaci\u00f3n Electr\u00f3nica Multitenant
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger

# Operational telemetry. Prometheus is exposed on /q/metrics and every HTTP
# response carries X-Correlation-ID for support tracing.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.otel.sdk.disabled=${CARABO_OTEL_DISABLED:true}
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4317}
quarkus.otel.resource.attributes=service.name=carabo,service.namespace=tordo
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) correlationId=%X{correlationId} %s%e%n
carabo.webhooks.allow-private-addresses=${CARABO_WEBHOOK_ALLOW_PRIVATE_ADDRESSES:false}

# SUNAT GRE REST API credentials
carabo.sunat.gre.client-id=${SUNAT_GRE_CLIENT_ID:not-configured}
carabo.sunat.gre.client-secret=${SUNAT_GRE_CLIENT_SECRET:not-configured}

# Build identity exposed by /version.
carabo.build.version=${CARABO_VERSION:0.2.0}
carabo.build.date=${CARABO_BUILD_DATE:2026-10-15}
carabo.build.commit=${CARABO_COMMIT:local}
